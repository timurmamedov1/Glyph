name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # -Werror is already in the makefile flags so any warning fails the build
      - name: build
        run: make

      - name: run tests
        run: make test

      - name: gc unit tests
        run: make gctest

  # every test program again under asan + ubsan with the gc running on every
  # allocation. lsan comes with asan on linux so leaks fail it too
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # older asan runtimes crash on the aslr entropy newer runner kernels use
      - name: lower aslr entropy for asan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: run tests under sanitizers
        run: make sanitize
